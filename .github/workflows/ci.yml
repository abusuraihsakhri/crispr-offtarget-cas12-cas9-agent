name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

env:
  AUDIT_SECRET_KEY: ${{ github.sha }}

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,dev]"
      - name: Compile Python sources
        run: python -m compileall -q agents crispr_offtarget_scan cli.py crispr_cas12_cas9.py enrichment.py simulator.py
      - name: Run test suite
        run: python -m pytest -q

  quality:
    name: Build, lint, and audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,dev]"
      - name: Lint
        run: ruff check .
      - name: Build distributions
        run: python -m build
      - name: Audit Python dependencies
        run: pip-audit
      - name: Smoke-test installed CLI entry points
        run: |
          crispr-offtarget --help
          crispr-agent --help
      - name: Validate browser JavaScript syntax
        run: node --check web/app.js

  browser:
    name: Browser Python smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pinned browser test dependency
        run: |
          python -m pip install "playwright==1.63.0"
          python -m playwright install --with-deps chromium
      - name: Exercise Pyodide app end to end
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/crispr-pages.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python tests/browser_smoke.py
